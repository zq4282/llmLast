[project]
name = "llmlast"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "langgraph>=1.0.0",
    "pydantic-settings>=2.10.0",
    "pyyaml>=6.0.2",
    "uvicorn>=0.53.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
