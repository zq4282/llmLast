  human: "正在为您转接人工，请稍候。"
  unknown: "抱歉，我没太听明白，您能再说一遍吗？"
  end: "本次服务已结束，感谢您的来电。"
  unknown_first: "抱歉，我没太听明白。请根据上一条提示重新回答。"
  unknown_second: "抱歉，我还是没能理解。请再回答一次，或直接说“转人工”。"
  unknown_handoff: "还是没能理解您的意思，正在为您转接人工客服，本次沟通记录已同步，请稍候。"
  unsupported_first: "当前流程无法处理这句话，请根据上一条提示重新回答。"
  unsupported_second: "当前流程仍无法处理您的回复。请再回答一次，或直接说“转人工”。"
  unsupported_handoff: "当前流程无法继续处理，正在为您转接人工客服，本次沟通记录已同步，请稍候。"
  idle_unknown_first: "抱歉，我没有理解您的回复。请说明是否需要同时退款并退订，或转人工客服。"
  idle_unknown_second: "请直接说明“退款并退订”或“转人工”。如果仍无法识别，我将为您转接人工客服。"
  idle_unsupported_first: "当前退款并退订流程无法处理这项内容。请说明是否继续办理，或回复“转人工”。"
  idle_unsupported_second: "请直接回复“退款并退订”或“转人工”。如果仍无法继续，我将为您转接人工客服。"
  confirm_refund_unsubscribe_unknown_first: "我没有理解您的回复。请问是否确认退款并退订{merchant}？请回复“确认”或“取消”。"
  confirm_refund_unsubscribe_unknown_second: "请直接回复“确认”“取消”或“转人工”，我再继续为您处理。"
  confirm_refund_unsubscribe_unsupported_first: "当前正在确认退款并退订{merchant}。请回复“确认”“取消”，或说“转人工”。"
  confirm_refund_unsubscribe_unsupported_second: "请直接回复“确认”“取消”或“转人工”。如果仍无法继续，我将为您转接人工客服。"
  ask_order_info_unknown_first: "我没有识别到有效的手机号或订单号，请重新提供下单手机号或订单号。"
  ask_order_info_unknown_second: "请直接提供11位下单手机号、订单号，或回复“转人工”。"
