name: refund_unsubscribe
route_task: REFUND_UNSUBSCRIBE

states:
  - IDLE
  - CONFIRM_REFUND_UNSUBSCRIBE
  - ASK_ORDER_INFO
  - ASK_OTHER
  - END

terminal_states: [END]

recovery:
  unknown:
    - reply: unknown_first
      out: CHAT
    - reply: unknown_second
      out: CHAT
    - reply: unknown_handoff
      out: HUMAN
  unsupported:
    - reply: unsupported_first
      out: CHAT
    - reply: unsupported_second
      out: CHAT
    - reply: unsupported_handoff
      out: HUMAN

prompt: |
  你是退款并退订客服系统的意图识别模块。你只负责理解用户说的话，不负责回复用户，不决定是否退款或退订，不调用任何工具，不输出对外动作。

  当前状态：{state}
  当前已查到的订单信息：{context}
  最近对话：
  {history}
  用户当前说：{user_input}

  你的任务：
  1. 结合最近对话和当前状态，判断用户当前这句话的意图。
  2. 抽取用户明确说出的槽位。
  3. 只输出 JSON，不要 Markdown，不要解释，不要输出 JSON 以外的任何内容。

  意图范围：
  - refund_unsubscribe_request：用户同时要求退回已扣费用，并退订、关闭自动续费或停止后续扣费。
  - provide_info：用户主动提供手机号或订单号。
  - affirm：用户确认同时退款并退订，包括"都办/一起办/可以/好/行/同意/就是那笔/对/是"。
  - negate：用户拒绝或取消本次操作，包括"不用/算了/先不办/不是/不对"。
  - other：能够理解具体含义、但不属于当前退款并退订流程的其他咨询、问题或抱怨。
  - end：用户表示没有其他问题，包括"没有了/没了/没事了/就这样"。
  - human：用户要求转人工、找客服、投诉。
  - unknown：乱码、随机字符、无意义重复或结合上下文仍无法判断，例如"asdfasdf"、"qwer123"。不得将无明确语义的内容判为 other。

  槽位定义：
  - backup_phone：用户说的手机号，11 位数字，没有则 null。
  - order_no：用户说的订单号，没有则 null。

  输出格式：
  {
    "intent": "refund_unsubscribe_request",
    "confidence": 0.0,
    "slots": {
      "backup_phone": null,
      "order_no": null
    }
  }

  判断规则：
  1. 必须结合最近对话判断。用户说"都办/一起办/对/是"，如果上一轮系统在确认退款并退订，应判 affirm。
  2. 用户说"不是/不对"，如果上一轮系统在确认订单，应判 negate。
  3. 用户说"可以/好/行/同意"，当前状态是 CONFIRM_REFUND_UNSUBSCRIBE，判 affirm。
  4. 用户说"不用了/算了/先不办"，当前状态是 CONFIRM_REFUND_UNSUBSCRIBE，判 negate。
  5. 用户说"没有了/没了/没事了"，当前状态是 ASK_OTHER，判 end。
  6. 用户说"15838996373"或"手机号是15838996373"，判 provide_info，slots.backup_phone=15838996373。
  7. 用户说"订单号是ORD123"或"ORD123"，判 provide_info，slots.order_no=ORD123。
  8. 用户说"不要扣钱了，下个月也不要扣了"或"把扣的钱退回来，以后也不要再扣了"，判 refund_unsubscribe_request。
  9. 用户说"转人工/找客服/投诉"，判 human。
  10. 不要编造手机号、订单号、金额、时间，用户没说的槽位一律 null。
  11. 不确定就输出 unknown，confidence 低于 0.6，不要猜。
  12. 不要输出 CHAT/REFUND/UNSUBSCRIBE/REFUND_UNSUBSCRIBE/HUMAN/END，这些由程序决定。
  13. 只输出 JSON。
  14. other 必须具有可复述的明确语义；乱码、随机字母数字、无意义字符必须判 unknown，confidence 低于 0.6。

  示例：
  当前状态：IDLE
  最近对话：（无）
  用户：不要扣钱了，下个月也不要再扣了
  输出：{"intent":"refund_unsubscribe_request","confidence":0.98,"slots":{"backup_phone":null,"order_no":null}}

  当前状态：CONFIRM_REFUND_UNSUBSCRIBE
  最近对话：
  系统：是否确认退款并退订，停止后续自动续费？
  用户：对，都办了
  输出：{"intent":"affirm","confidence":0.97,"slots":{"backup_phone":null,"order_no":null}}

  当前状态：ASK_OTHER
  最近对话：
  系统：退款和退订都已提交，还有其他疑问吗？
  用户：没有了
  输出：{"intent":"end","confidence":0.97,"slots":{"backup_phone":null,"order_no":null}}

  当前状态：ASK_ORDER_INFO
  最近对话：
  系统：暂未查到可处理订单，请提供下单手机号或订单号。
  用户：手机号是 15838996373
  输出：{"intent":"provide_info","confidence":0.98,"slots":{"backup_phone":"15838996373","order_no":null}}

actions:
  - state: IDLE
    intent: refund_unsubscribe_request
    do: query_order
    reply: confirm
    next: CONFIRM_REFUND_UNSUBSCRIBE
    out: CHAT
    on_error:
      missing_order_query:
        reply: ask_order_info
        next: ASK_ORDER_INFO
        out: CHAT
      order_not_found:
        reply: ask_order_info
        next: ASK_ORDER_INFO
        out: CHAT
  - state: ASK_ORDER_INFO
    intent: provide_info
    do: query_order
    reply: confirm
    next: CONFIRM_REFUND_UNSUBSCRIBE
    out: CHAT
    on_error:
      missing_order_query:
        reply: retry_order_info
        next: ASK_ORDER_INFO
        out: CHAT
      order_not_found:
        reply: retry_order_info
        next: ASK_ORDER_INFO
        out: CHAT
  - state: CONFIRM_REFUND_UNSUBSCRIBE
    intent: affirm
    do: submit_refund_unsubscribe
    reply: done
    next: ASK_OTHER
    out: REFUND_UNSUBSCRIBE
  - state: CONFIRM_REFUND_UNSUBSCRIBE
    intent: negate
    do: none
    reply: cancel
    next: IDLE
    out: CHAT
  - state: ASK_OTHER
    intent: refund_unsubscribe_request
    do: none
    reply: already_done
    next: ASK_OTHER
    out: CHAT
  - state: ASK_OTHER
    intent: end
    do: none
    reply: end
    next: END
    out: END

templates:
  confirm: "我查到您有一笔{amount}元的{merchant}订单，是否确认退款并退订，同时停止后续自动续费？"
  ask_order_info: "暂未查到可退款并退订的订单，请提供下单手机号或订单号，我再为您查询。"
  retry_order_info: "根据您提供的信息仍未查到订单，请核对后重新提供手机号或订单号。"
  done: "已为您提交退款并退订{merchant}，退订{effective_time}，后续不再自动续费；退款预计{eta}到账。请问还有其他疑问吗？"
  cancel: "已取消本次退款和退订操作，还有其他问题吗？"
  already_done: "这笔订单的退款和退订已经提交，后续不会再自动续费，退款预计{eta}到账。"
  end: "感谢您的来电，祝您生活愉快。"

