name: human
route_task: HUMAN

global_handlers:
  other:
    enabled: true

states:
  - IDLE
  - ASK_REASON
  - INSULT_WARNED
  - AFTER_CANCEL
  - CONFIRM_TRANSFER
  - END

terminal_states: [END]

state_policies:
  IDLE:
    switch_policy: allow
  ASK_REASON:
    switch_policy: confirm
    remind_after_other: true
    reminder: "如果仍需转人工，请继续说明遇到的问题，或直接说“转人工”。"
  INSULT_WARNED:
    switch_policy: confirm
    remind_after_other: true
    reminder: "如果仍需转人工，请继续说明遇到的问题。"
  AFTER_CANCEL:
    switch_policy: allow
  CONFIRM_TRANSFER:
    switch_policy: confirm
    remind_after_other: true
    reminder: "刚才正在确认是否转人工，请回复“需要”或“不需要”。"
  END:
    switch_policy: allow

recovery:
  unknown:
    - reply: unknown_first
      out: CHAT
    - reply: unknown_second
      out: CHAT
    - reply: unknown_handoff
      out: HUMAN
  unsupported:
    - reply: unsupported_first
      out: CHAT
    - reply: unsupported_second
      out: CHAT
    - reply: unsupported_handoff
      out: HUMAN

prompt_file: prompt.md

actions:
  - state: IDLE
    intent: transfer_request
    do: record_reason
    reply: transferring
    next: END
    out: HUMAN
    on_error:
      missing_reason:
        reply: ask_reason
        next: ASK_REASON
        out: CHAT
  - state: IDLE
    intent: insult
    do: record_insult
    reply: insult_first
    next: INSULT_WARNED
    out: CHAT
  - state: ASK_REASON
    intent: insult
    do: record_insult
    reply: insult_first
    next: INSULT_WARNED
    out: CHAT
  - state: ASK_REASON
    intent: provide_info
    do: record_reason
    reply: transferring
    next: END
    out: HUMAN
    on_error:
      missing_reason:
        reply: ask_reason_again
        next: ASK_REASON
        out: CHAT
  - state: ASK_REASON
    intent: transfer_request
    do: none
    reply: transferring_direct
    next: END
    out: HUMAN
  - state: ASK_REASON
    intent: negate
    do: none
    reply: cancel_transfer
    next: AFTER_CANCEL
    out: CHAT
  - state: ASK_REASON
    intent: end
    do: none
    reply: end
    next: END
    out: CHAT
  - state: INSULT_WARNED
    intent: insult
    do: record_insult
    reply: insult_handoff
    next: END
    out: HUMAN
  - state: INSULT_WARNED
    intent: provide_info
    do: record_reason
    reply: transferring
    next: END
    out: HUMAN
    on_error:
      missing_reason:
        reply: ask_reason_again
        next: INSULT_WARNED
        out: CHAT
  - state: INSULT_WARNED
    intent: transfer_request
    do: none
    reply: transferring_direct
    next: END
    out: HUMAN
  - state: INSULT_WARNED
    intent: negate
    do: none
    reply: cancel_transfer
    next: AFTER_CANCEL
    out: CHAT
  - state: INSULT_WARNED
    intent: end
    do: none
    reply: end
    next: END
    out: CHAT
  - state: AFTER_CANCEL
    intent: insult
    do: record_insult
    reply: confirm_transfer_after_insult
    next: CONFIRM_TRANSFER
    out: CHAT
  - state: AFTER_CANCEL
    intent: transfer_request
    do: none
    reply: transferring_direct
    next: END
    out: HUMAN
  - state: AFTER_CANCEL
    intent: provide_info
    do: none
    reply: end_after_cancel
    next: END
    out: END
  - state: AFTER_CANCEL
    intent: other
    do: none
    reply: end_after_cancel
    next: END
    out: END
  - state: AFTER_CANCEL
    intent: negate
    do: none
    reply: end_after_cancel
    next: END
    out: END
  - state: AFTER_CANCEL
    intent: end
    do: none
    reply: end_after_cancel
    next: END
    out: END
  - state: CONFIRM_TRANSFER
    intent: transfer_request
    do: none
    reply: transferring_direct
    next: END
    out: HUMAN
  - state: CONFIRM_TRANSFER
    intent: insult
    do: record_insult
    reply: insult_handoff
    next: END
    out: HUMAN
  - state: CONFIRM_TRANSFER
    intent: negate
    do: none
    reply: end_after_cancel
    next: END
    out: END
  - state: CONFIRM_TRANSFER
    intent: end
    do: none
    reply: end_after_cancel
    next: END
    out: END
  - state: CONFIRM_TRANSFER
    intent: provide_info
    do: none
    reply: end_after_cancel
    next: END
    out: END
  - state: CONFIRM_TRANSFER
    intent: other
    do: none
    reply: end_after_cancel
    next: END
    out: END

templates:
  ask_reason: "好的，为了更快帮您处理，方便先简单说一下您遇到的问题吗？"
  ask_reason_again: "抱歉，我还没有记录到具体问题。请简单说明您遇到的情况，或说“直接转人工”。"
  transferring: "明白了，您反馈的是{reason}。正在为您转接人工客服，请稍候。"
  transferring_direct: "好的，正在为您转接人工客服，请稍候。"
  cancel_transfer: "好的，如后续还有其他问题，随时告诉我。"
  end: "感谢您的来电。"
  insult_first: "非常抱歉给您带来不好的体验，我先帮您把问题处理好。请问您遇到的是什么情况？"
  insult_handoff: "非常抱歉给您带来不好的体验，我马上为您转接人工客服，请稍候。"
  confirm_transfer_after_insult: "我理解您现在比较生气。请问需要为您转接人工客服吗？"
  end_after_cancel: "好的，本次服务已结束。"

fallbacks:
  human: "正在为您转接人工，请稍候。"
  unknown: "抱歉，没太听明白，您能再说一遍吗？"
  end: "本次服务已结束。"
  unknown_first: "抱歉，我没听清您遇到的问题。请再简单说一遍，或说“直接转人工”。"
  unknown_second: "抱歉，我还是没能理解。您可以再说一次，也可以直接说“转人工”。"
  unknown_handoff: "还是没能理解您的意思，正在为您转接人工客服，请稍候。"
  unsupported_first: "当前正在收集转人工原因。请简单说明您遇到的问题，或说“直接转人工”。"
  unsupported_second: "请说明遇到的问题，或直接说“转人工”。"
  unsupported_handoff: "当前流程无法继续处理，正在为您转接人工客服，请稍候。"
