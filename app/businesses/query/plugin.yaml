name: query
description: 余额与账单查询
keywords: [余额, 账单, 消费, 欠费]
default_intent: query_balance

intents:
  query_balance:
    keywords: [余额, 欠费, 还有多少钱]
    action: query_balance
  query_bill:
    keywords: [账单, 消费, 明细]
    action: query_bill
    slot_patterns:
      month: '(?P<value>20\d{2}[-年/]\d{1,2})'

actions:
  query_balance:
    handler: handlers.query_balance
    success_template: balance_result
  query_bill:
    handler: handlers.query_bill
    success_template: bill_result

templates:
  balance_result: '当前账户余额为 ¥{balance}。'
  bill_result: '{month} 账单金额为 ¥{amount}，状态：{status}。'
  error: 查询服务暂时不可用，请稍后重试。
