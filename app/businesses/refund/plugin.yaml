name: refund
route_task: REFUND

states:
  - IDLE
  - CONFIRM_REFUND
  - ASK_ORDER_INFO
  - ASK_OTHER
  - END

terminal_states: [END]

prompt: |
  你是退款客服系统的意图识别模块。你只负责理解用户说的话，不负责回复用户，不决定是否退款，不调用任何工具，不输出对外动作。

  当前状态：{state}
  当前已查到的订单信息：{context}
  最近对话：
  {history}
  用户当前说：{user_input}

  你的任务：
  1. 结合最近对话和当前状态，判断用户当前这句话的意图。
  2. 抽取用户明确说出的槽位。
  3. 只输出 JSON，不要 Markdown，不要解释，不要输出 JSON 以外的任何内容。

  意图范围：
  - refund_request：用户要求退款、质问扣款、问为什么扣钱、说赶紧退、退我钱。
  - provide_info：用户主动提供手机号或订单号。
  - affirm：用户同意、确认，包括"退了吧/可以/好/行/同意/就是那笔/对/是"。
  - negate：用户拒绝、否定，包括"不用/别退/先不退/不是/不对"。
  - other：能够理解具体含义、但不属于当前退款流程的其他咨询、问题或抱怨，例如咨询发票、套餐、物流。
  - end：用户表示没有其他问题，包括"没有了/没了/没事了/就这样"。
  - human：用户要求转人工、找客服、投诉。
  - unknown：乱码、随机字符、无意义重复或结合上下文仍无法判断，例如"asdfasdf"、"qwer123"。不得将无明确语义的内容判为 other。

  槽位定义：
  - backup_phone：用户说的手机号，11 位数字，没有则 null。
  - order_no：用户说的订单号，没有则 null。

  输出格式：
  {
    "intent": "refund_request",
    "confidence": 0.0,
    "slots": {
      "backup_phone": null,
      "order_no": null
    }
  }

  判断规则：
  1. 必须结合最近对话判断。用户说"就是那笔/对/是"，如果上一轮系统在问"是否退款"，应判 affirm。
  2. 用户说"不是/不对"，如果上一轮系统在确认订单，应判 negate。
  3. 用户说"退了吧/可以/好/行/同意"，当前状态是 CONFIRM_REFUND，判 affirm。
  4. 用户说"不用了/先不退/别退"，当前状态是 CONFIRM_REFUND，判 negate。
  5. 用户说"没有了/没了/没事了"，当前状态是 ASK_OTHER，判 end。
  6. 用户说"15838996373"或"手机号是15838996373"，判 provide_info，slots.backup_phone=15838996373。
  7. 用户说"订单号是ORD123"或"ORD123"，判 provide_info，slots.order_no=ORD123。
  8. 用户说"为什么扣钱/赶紧退/退我钱"，判 refund_request。
  9. 用户说"转人工/找客服/投诉"，判 human。
  10. 不要编造手机号、订单号、金额、时间，用户没说的槽位一律 null。
  11. 不确定就输出 unknown，confidence 低于 0.6，不要猜。
  12. 不要输出 CHAT/REFUND/HUMAN/END，这些由程序决定。
  13. 只输出 JSON。
  14. other 必须具有可复述的明确语义；乱码、随机字母数字、无意义字符必须判 unknown，confidence 低于 0.6。

  示例：
  当前状态：IDLE
  最近对话：（无）
  用户：为什么扣我钱，赶紧退过来
  输出：{"intent":"refund_request","confidence":0.93,"slots":{"backup_phone":null,"order_no":null}}

  当前状态：CONFIRM_REFUND
  最近对话：
  用户：为什么扣我钱？
  系统：查到您一笔 29.9 元扣款，是否退款？
  用户：就是那笔
  输出：{"intent":"affirm","confidence":0.95,"slots":{"backup_phone":null,"order_no":null}}

  当前状态：ASK_OTHER
  最近对话：
  用户：退了吧
  系统：已提交退款，还有其他疑问吗？
  用户：没有了
  输出：{"intent":"end","confidence":0.97,"slots":{"backup_phone":null,"order_no":null}}

  当前状态：ASK_ORDER_INFO
  最近对话：
  系统：暂未查到可退款订单，请提供下单手机号或订单号。
  用户：手机号是 15838996373
  输出：{"intent":"provide_info","confidence":0.98,"slots":{"backup_phone":"15838996373","order_no":null}}

  当前状态：CONFIRM_REFUND
  最近对话：
  系统：查到您一笔 19.9 元扣款，是否退款？
  用户：asdfasdf
  输出：{"intent":"unknown","confidence":0.10,"slots":{"backup_phone":null,"order_no":null}}

actions:
  - state: IDLE
    intent: refund_request
    do: query_order
    reply: confirm
    next: CONFIRM_REFUND
    out: CHAT
    on_error:
      missing_order_query:
        reply: ask_order_info
        next: ASK_ORDER_INFO
        out: CHAT
      order_not_found:
        reply: ask_order_info
        next: ASK_ORDER_INFO
        out: CHAT
  - state: ASK_ORDER_INFO
    intent: provide_info
    do: query_order
    reply: confirm
    next: CONFIRM_REFUND
    out: CHAT
    on_error:
      missing_order_query:
        reply: retry_order_info
        next: ASK_ORDER_INFO
        out: CHAT
      order_not_found:
        reply: retry_order_info
        next: ASK_ORDER_INFO
        out: CHAT
  - state: CONFIRM_REFUND
    intent: affirm
    do: submit_refund
    reply: done
    next: ASK_OTHER
    out: REFUND
    on_error:
      already_refunded:
        reply: already_done
        next: ASK_OTHER
        out: CHAT
      order_not_found:
        reply: ask_order_info
        next: ASK_ORDER_INFO
        out: CHAT
  - state: CONFIRM_REFUND
    intent: negate
    do: none
    reply: cancel
    next: IDLE
    out: CHAT
  - state: ASK_OTHER
    intent: refund_request
    do: none
    reply: already_done
    next: ASK_OTHER
    out: CHAT
  - state: ASK_OTHER
    intent: end
    do: none
    reply: end
    next: END
    out: END

templates:
  confirm: "我查到您有一笔{amount}元在{merchant}的扣款，是否需要为您申请退款？"
  ask_order_info: "暂未查到可退款订单，请提供下单手机号或订单号，我再为您查询。"
  retry_order_info: "根据您提供的信息仍未查到订单，请核对后重新提供手机号或订单号。"
  done: "已为您提交退款，预计{eta}到账，具体到账时间以账单为准。请问还有其他疑问吗？"
  cancel: "已取消退款，还有其他问题吗？"
  already_done: "这笔退款已经提交过了，预计{eta}到账，您可以在账单里查看。"
  end: "感谢您的来电，祝您生活愉快。"

fallbacks:
  human: "正在为您转接人工，请稍候。"
  unknown: "抱歉，我没太听明白，您能再说一遍吗？"
  end: "本次服务已结束，感谢您的来电。"
  idle_unknown_first: "抱歉，我没有理解您的回复。请说明您需要查询扣款、申请退款，还是转人工客服。"
  idle_unknown_second: "请直接说明“申请退款”或“转人工”。如果仍无法识别，我将为您转接人工客服。"
  idle_unsupported_first: "当前退款流程无法处理这项内容。请说明是否继续申请退款，或回复“转人工”。"
  idle_unsupported_second: "请直接回复“申请退款”或“转人工”。如果仍无法继续，我将为您转接人工客服。"
  confirm_refund_unknown_first: "我没有理解您的回复。请问是否申请退回这笔{amount}元扣款？请回复“退款”或“不退款”。"
  confirm_refund_unknown_second: "请直接回复“退款”“不退款”或“转人工”，我再继续为您处理。"
  confirm_refund_unsupported_first: "当前正在确认这笔{amount}元扣款。请回复“退款”“不退款”，或说“转人工”。"
  confirm_refund_unsupported_second: "请直接回复“退款”“不退款”或“转人工”。如果仍无法继续，我将为您转接人工客服。"
  ask_order_info_unknown_first: "我没有识别到有效的手机号或订单号，请重新提供下单手机号或订单号。"
  ask_order_info_unknown_second: "请直接提供11位下单手机号、订单号，或回复“转人工”。"
  ask_order_info_unsupported_first: "当前需要下单手机号或订单号才能继续查询，请重新提供，或回复“转人工”。"
  ask_order_info_unsupported_second: "请直接提供11位下单手机号、订单号，或回复“转人工”。如果仍无法继续，我将为您转接人工客服。"
  ask_other_unknown_first: "我没有理解您的回复。若没有其他问题请回复“没有了”，也可以直接说“转人工”。"
  ask_other_unknown_second: "请回复“没有了”结束服务，或回复“转人工”。"
  ask_other_unsupported_first: "退款流程已经处理完成。若没有其他问题请回复“没有了”，其他业务可回复“转人工”。"
  ask_other_unsupported_second: "请回复“没有了”结束服务，或回复“转人工”。如果仍无法继续，我将为您转接人工客服。"
