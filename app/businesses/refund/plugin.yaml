# 插件唯一名称；同时也是代码中 state["business"] 的值，以及 handlers.py 的模块目录名。
name: refund
# 顶级路由 Task；Task Router 返回 REFUND 时选择本插件。
route_task: REFUND

# 插件级通用意图处理器；对插件的所有非终态状态生效，状态无需重复配置。
global_handlers:
  # 当前插件识别出 other 时，临时调用无状态 other 插件处理本轮消息。
  other:
    # true 表示启用；other 只临时回答或二级路由，不覆盖退款流程状态。
    enabled: true

# 本插件允许出现的全部状态；第一个状态 IDLE 同时是 initial_state。
states:
  - IDLE             # 初始状态，尚未开始查询或确认退款。
  - CONFIRM_REFUND   # 已查到订单，等待用户确认是否退款。
  - ASK_ORDER_INFO   # 缺少订单定位信息，等待手机号或订单号。
  - RETRY_ORDER_INFO # 补充信息后仍查不到，最后再核对一次。
  - ASK_OTHER        # 退款已提交，询问用户是否还有其他问题。
  - END              # 退款会话已经结束。

# 终态集合；进入这些状态后流程被标记为 COMPLETED，不再锁定顶级路由。
terminal_states: [END]

# 各状态的跨插件切换策略，只影响 other 返回 ROUTE 的情况，不影响普通闲聊回答。
state_policies:
  # 初始状态尚未执行关键操作，可以直接切换到其他业务。
  IDLE:
    # allow=直接切换；confirm=询问用户；deny=禁止切换。
    switch_policy: allow
  # 已进入退款确认环节，切换前必须征得用户同意。
  CONFIRM_REFUND:
    switch_policy: allow
    # other 回答闲聊后，是否由引擎追加当前退款流程提醒。
    remind_after_other: false
    # 追加提醒模板；由引擎生成，other 插件本身看不到退款上下文。
    reminder: "刚才的退款还在等待确认，请回复“退款”或“不退款”。"
  # 收集订单信息时允许切换；原退款流程会保存为 SUSPENDED。
  ASK_ORDER_INFO:
    switch_policy: allow
  RETRY_ORDER_INFO:
    switch_policy: allow
  # 当前退款动作已经完成，可以直接进入其他业务。
  ASK_OTHER:
    switch_policy: allow
  # END 本身不会保持 ACTIVE；该配置作为脏数据或兼容场景的安全默认值。
  END:
    switch_policy: allow

# 当前插件未理解用户，或者模型返回当前状态不支持的意图时，采用分级恢复。
recovery:
  # unknown：模型无法理解语义；每触发一次按顺序推进一步。
  unknown:
    # reply 引用 fallbacks 中的话术 key；out 是本轮对外输出类型。
    - reply: unknown_first
      out: CHAT
    - reply: unknown_second
      out: CHAT
    # 最后一步必须是 HUMAN，表示连续无法理解后升级人工。
    - reply: unknown_handoff
      out: HUMAN
  # unsupported：语义可理解，但当前 state + intent 没有配置 actions 转移。
  unsupported:
    - reply: unsupported_first
      out: CHAT
    - reply: unsupported_second
      out: CHAT
    - reply: unsupported_handoff
      out: HUMAN

# 插件内意图识别提示词；只负责返回 intent/confidence/slots，不直接回复用户。
# 占位符由引擎调用模型前替换：
# - {state}：当前 plugin_state。
# - {context}：跨轮保存的订单及业务上下文。
# - {history}：最近对话历史。
# - {user_input}：本轮用户原始输入。
prompt_file: prompt.md

# 状态动作表：通过“当前 state + 模型 intent”唯一确定动作、回复、下一状态和输出。
# 每条动作中的字段含义：
# - state：动作生效的当前状态，必须已在 states 中声明。
# - intent：prompt 返回的插件内意图。
# - do：调用 handlers.py 中的同名函数；none 表示不执行业务函数。
# - reply：成功时使用的 templates/fallbacks 话术 key。
# - next：成功后进入的下一状态，必须已在 states 中声明。
# - out：对外结果类型，例如 CHAT、REFUND、HUMAN、END。
# - on_error：handler 返回 ok=false 时，按 error code 覆盖 reply/next/out。
actions:
  # 初始退款请求：先查询订单，成功后进入退款确认。
  - state: IDLE
    intent: refund_request
    do: query_order
    reply: confirm
    next: CONFIRM_REFUND
    out: CHAT
    # 查询订单失败时不采用成功转移，而是进入下列错误分支。
    on_error:
      # 没有订单号、备用手机号或可用主叫号码。
      missing_order_query:
        reply: ask_order_info
        next: ASK_ORDER_INFO
        out: CHAT
      # 已提供查询条件，但没有找到符合退款条件的订单。
      order_not_found:
        reply: ask_order_info
        next: ASK_ORDER_INFO
        out: CHAT
  # 重复表达办理诉求时继续收集信息，不重新查询或消耗核对次数。
  - state: ASK_ORDER_INFO
    intent: refund_request
    do: none
    reply: continue_order_info
    next: ASK_ORDER_INFO
    out: CHAT
  - state: RETRY_ORDER_INFO
    intent: refund_request
    do: none
    reply: continue_retry_order_info
    next: RETRY_ORDER_INFO
    out: CHAT
  # 用户补充订单号或手机号后，再次查询订单。
  - state: ASK_ORDER_INFO
    intent: provide_info
    do: query_order
    reply: confirm
    next: CONFIRM_REFUND
    out: CHAT
    on_error:
      missing_order_query:
        reply: retry_order_info
        next: RETRY_ORDER_INFO
        out: CHAT
      order_not_found:
        reply: retry_order_info
        next: RETRY_ORDER_INFO
        out: CHAT
  # 最后一次核对仍失败就转人工，不能一直要求用户重复提供信息。
  - state: RETRY_ORDER_INFO
    intent: provide_info
    do: query_order
    reply: confirm
    next: CONFIRM_REFUND
    out: CHAT
    on_error:
      missing_order_query:
        reply: order_lookup_handoff
        next: END
        out: HUMAN
      order_not_found:
        reply: order_lookup_handoff
        next: END
        out: HUMAN
  # 用户已经拿不出查询信息时，交给人工继续核实。
  - state: ASK_ORDER_INFO
    intent: unable_to_provide
    do: none
    reply: no_order_info_handoff
    next: END
    out: HUMAN
  - state: RETRY_ORDER_INFO
    intent: unable_to_provide
    do: none
    reply: no_order_info_handoff
    next: END
    out: HUMAN
  # 收集信息时也允许用户明确取消或结束。
  - state: ASK_ORDER_INFO
    intent: negate
    do: none
    reply: cancel_order_lookup
    next: END
    out: END
  - state: RETRY_ORDER_INFO
    intent: negate
    do: none
    reply: cancel_order_lookup
    next: END
    out: END
  - state: ASK_ORDER_INFO
    intent: end
    do: none
    reply: end
    next: END
    out: END
  - state: RETRY_ORDER_INFO
    intent: end
    do: none
    reply: end
    next: END
    out: END
  # 用户确认退款：提交退款，成功后进入“是否还有其他问题”。
  - state: CONFIRM_REFUND
    intent: affirm
    do: submit_refund
    reply: done
    next: ASK_OTHER
    out: REFUND
  # 用户拒绝退款：不调用业务动作，回到初始状态。
  - state: CONFIRM_REFUND
    intent: negate
    do: none
    reply: cancel
    next: IDLE
    out: CHAT
  # 退款提交后再次要求退款：不重复提交，只告知已经处理。
  - state: ASK_OTHER
    intent: refund_request
    do: none
    reply: already_done
    next: ASK_OTHER
    out: CHAT
  # 用户明确没有其他问题：结束当前退款流程。
  - state: ASK_OTHER
    intent: end
    do: none
    reply: end
    next: END
    out: END

# 正常动作话术表；actions.reply 通过 key 引用这里的文本。
# 花括号变量由 context、slots 和 action_result 合并后渲染。
templates:
  # query_order 成功后确认退款，amount/merchant 来自订单查询结果。
  confirm: "我查到您有一笔{amount}元在{merchant}的扣款，是否需要为您申请退款？"
  # 首次缺少订单定位信息。
  ask_order_info: "暂未查到可退款订单，请提供下单手机号或订单号，我再为您查询。"
  # 用户补充信息后仍未找到订单。
  continue_order_info: "好的，继续为您处理退款，请提供下单手机号或订单号，我再为您查询。"
  continue_retry_order_info: "好的，继续为您处理退款。请再核对一次下单手机号或订单号；若仍查不到，我将为您转人工核实。"
  retry_order_info: "根据您提供的信息仍未查到可办理退款的订单，请再核对一次手机号或订单号；若仍查不到，我将为您转人工核实退款问题。"
  order_lookup_handoff: "核对后仍未查到可办理退款的订单，正在为您转接人工客服进一步核实退款问题，请稍候。"
  no_order_info_handoff: "了解，您暂时无法提供查询信息，退款申请还无法继续，正在为您转接人工客服核实，请稍候。"
  cancel_order_lookup: "好的，已停止本次退款的订单查询和办理，感谢您的来电。"
  # submit_refund 成功，eta 来自动作结果。
  done: "已为您提交退款，预计{eta}到账，具体到账时间以账单为准。请问还有其他疑问吗？"
  # 用户在确认环节拒绝退款。
  cancel: "已取消退款，还有其他问题吗？"
  # 防止 ASK_OTHER 状态重复提交退款。
  already_done: "这笔退款已经提交过了，预计{eta}到账，您可以在账单里查看。"
  # 用户明确结束服务。
  end: "本次退款服务已结束，感谢您的来电，祝您生活愉快。"

# 兜底话术表；用于 human、unknown、unsupported、终态或业务错误场景。
# 状态专属 key 遵循“状态名小写_恢复话术 key”，优先于通用 key。
fallbacks:
  # 当前退款插件内识别到 human 时使用，不会切换到独立 human 插件。
  human: "正在为您转接人工客服继续处理退款问题，请稍候。"
  # 未指定分级恢复 key 时的通用无法理解话术。
  unknown: "抱歉，我没太听明白您的退款诉求，您能再说一遍吗？"
  # 终态通用话术。
  end: "本次退款服务已结束，感谢您的来电。"
  # unknown 的第 1、2 次恢复以及最终人工升级话术。
  unknown_first: "抱歉，我没太听明白您的退款诉求，请根据上一条提示重新回答。"
  unknown_second: "抱歉，我还是没能理解您的退款诉求。请再回答一次，或直接说“转人工”。"
  unknown_handoff: "还是没能理解您的退款诉求，正在为您转接人工客服核实退款问题，本次沟通记录已同步，请稍候。"
  # unsupported 的第 1、2 次恢复以及最终人工升级话术。
  unsupported_first: "当前退款流程无法处理这句话，请根据上一条提示重新回答。"
  unsupported_second: "当前退款流程仍无法处理您的回复。请再回答一次，或直接说“转人工”。"
  unsupported_handoff: "当前退款流程无法继续处理，正在为您转接人工客服核实退款问题，本次沟通记录已同步，请稍候。"
  # IDLE 状态覆盖通用 unknown/unsupported，使提示更贴合退款入口。
  idle_unknown_first: "抱歉，我没有理解您的回复。请说明您需要查询扣款、申请退款，还是转人工客服。"
  idle_unknown_second: "请直接说明“申请退款”或“转人工”。如果仍无法识别，我将为您转接人工客服。"
  idle_unsupported_first: "当前退款流程无法处理这项内容。请说明是否继续申请退款，或回复“转人工”。"
  idle_unsupported_second: "请直接回复“申请退款”或“转人工”。如果仍无法继续，我将为您转接人工客服。"
  # CONFIRM_REFUND 状态覆盖，提醒用户只能确认、拒绝或转人工。
  confirm_refund_unknown_first: "我没有理解您的回复。请问是否申请退回这笔{amount}元扣款？请回复“退款”或“不退款”。"
  confirm_refund_unknown_second: "请直接回复“退款”“不退款”或“转人工”，我再继续为您处理。"
  confirm_refund_unsupported_first: "当前正在确认这笔{amount}元扣款。请回复“退款”“不退款”，或说“转人工”。"
  confirm_refund_unsupported_second: "请直接回复“退款”“不退款”或“转人工”。如果仍无法继续，我将为您转接人工客服。"
  # ASK_ORDER_INFO 状态覆盖，提示用户补充可查询的订单信息。
  ask_order_info_unknown_first: "办理退款需要下单手机号或订单号，我没有识别到有效信息，请重新提供。"
  ask_order_info_unknown_second: "为了查询可办理退款的订单，请直接提供11位下单手机号、订单号，或回复“转人工”。"
  ask_order_info_unsupported_first: "当前退款申请还在等待订单信息，请提供下单手机号或订单号，或回复“转人工”。"
  ask_order_info_unsupported_second: "办理退款前需要定位订单。请提供11位下单手机号、订单号，或回复“转人工”；若仍无法继续，我将为您转接人工客服。"
  # ASK_OTHER 状态覆盖，提示用户结束或转人工；明确的新业务由 other 负责路由。
  ask_other_unknown_first: "本次退款申请已经提交，我没有理解您接下来的问题。若没有其他问题请回复“没有了”，也可以说“转人工”。"
  ask_other_unknown_second: "本次退款申请已经提交。请回复“没有了”结束服务，或回复“转人工”。"
  ask_other_unsupported_first: "退款流程已经处理完成。若没有其他问题请回复“没有了”，其他业务可回复“转人工”。"
  ask_other_unsupported_second: "本次退款申请已经提交。请回复“没有了”结束服务，或回复“转人工”；若仍无法继续，我将为您转接人工客服。"
  human_handoff: "正在为您转接人工客服继续处理退款问题，本次沟通记录已同步，请稍候。"
