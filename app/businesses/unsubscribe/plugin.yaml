name: unsubscribe
route_task: UNSUBSCRIBE

global_handlers:
  other:
    enabled: true

states:
  - IDLE
  - CONFIRM_UNSUBSCRIBE
  - ASK_ORDER_INFO
  - RETRY_ORDER_INFO # 补充信息后仍查不到，最后再核对一次。
  - ASK_OTHER
  - END

terminal_states: [END]

state_policies:
  IDLE:
    switch_policy: allow
  CONFIRM_UNSUBSCRIBE:
    switch_policy: allow
    remind_after_other: true
    reminder: "刚才的退订还在等待确认，请回复“退订”或“不退订”。"
  ASK_ORDER_INFO:
    switch_policy: allow
  RETRY_ORDER_INFO:
    switch_policy: allow
  ASK_OTHER:
    switch_policy: allow
  END:
    switch_policy: allow

recovery:
  unknown:
    - reply: unknown_first
      out: CHAT
    - reply: unknown_second
      out: CHAT
    - reply: unknown_handoff
      out: HUMAN
  unsupported:
    - reply: unsupported_first
      out: CHAT
    - reply: unsupported_second
      out: CHAT
    - reply: unsupported_handoff
      out: HUMAN

prompt_file: prompt.md

actions:
  - state: IDLE
    intent: unsubscribe_request
    do: query_order
    reply: confirm
    next: CONFIRM_UNSUBSCRIBE
    out: CHAT
    on_error:
      missing_order_query:
        reply: ask_order_info
        next: ASK_ORDER_INFO
        out: CHAT
      order_not_found:
        reply: ask_order_info
        next: ASK_ORDER_INFO
        out: CHAT
  # 重复表达办理诉求时继续收集信息，不重新查询或消耗核对次数。
  - state: ASK_ORDER_INFO
    intent: unsubscribe_request
    do: none
    reply: continue_order_info
    next: ASK_ORDER_INFO
    out: CHAT
  - state: RETRY_ORDER_INFO
    intent: unsubscribe_request
    do: none
    reply: continue_retry_order_info
    next: RETRY_ORDER_INFO
    out: CHAT
  - state: ASK_ORDER_INFO
    intent: provide_info
    do: query_order
    reply: confirm
    next: CONFIRM_UNSUBSCRIBE
    out: CHAT
    on_error:
      missing_order_query:
        reply: retry_order_info
        next: RETRY_ORDER_INFO
        out: CHAT
      order_not_found:
        reply: retry_order_info
        next: RETRY_ORDER_INFO
        out: CHAT
  # 最后一次核对仍失败就转人工，不能一直要求用户重复提供信息。
  - state: RETRY_ORDER_INFO
    intent: provide_info
    do: query_order
    reply: confirm
    next: CONFIRM_UNSUBSCRIBE
    out: CHAT
    on_error:
      missing_order_query:
        reply: order_lookup_handoff
        next: END
        out: HUMAN
      order_not_found:
        reply: order_lookup_handoff
        next: END
        out: HUMAN
  # 用户已经拿不出查询信息时，交给人工继续核实。
  - state: ASK_ORDER_INFO
    intent: unable_to_provide
    do: none
    reply: no_order_info_handoff
    next: END
    out: HUMAN
  - state: RETRY_ORDER_INFO
    intent: unable_to_provide
    do: none
    reply: no_order_info_handoff
    next: END
    out: HUMAN
  # 收集信息时也允许用户明确取消或结束。
  - state: ASK_ORDER_INFO
    intent: negate
    do: none
    reply: cancel_order_lookup
    next: END
    out: END
  - state: RETRY_ORDER_INFO
    intent: negate
    do: none
    reply: cancel_order_lookup
    next: END
    out: END
  - state: ASK_ORDER_INFO
    intent: end
    do: none
    reply: end
    next: END
    out: END
  - state: RETRY_ORDER_INFO
    intent: end
    do: none
    reply: end
    next: END
    out: END
  - state: CONFIRM_UNSUBSCRIBE
    intent: affirm
    do: submit_unsubscribe
    reply: done
    next: ASK_OTHER
    out: UNSUBSCRIBE
  - state: CONFIRM_UNSUBSCRIBE
    intent: negate
    do: none
    reply: cancel
    next: IDLE
    out: CHAT
  - state: ASK_OTHER
    intent: unsubscribe_request
    do: none
    reply: already_done
    next: ASK_OTHER
    out: CHAT
  - state: ASK_OTHER
    intent: end
    do: none
    reply: end
    next: END
    out: END

